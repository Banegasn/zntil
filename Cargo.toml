[package]
name = "zntil"
version = "0.2.0"
edition = "2024"
default-run = "zntil"
license = "Apache-2.0"
description = "A small self-hosted Rust gateway with traffic filtering and a live management console"
homepage = "https://zntil.tivq.link"
repository = "https://github.com/Banegasn/zntil"

[features]
cli = ["dep:clap", "dep:reqwest"]

[[bin]]
name = "zntilctl"
path = "src/bin/zntilctl.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
async-trait = "0.1"
arc-swap = "1"
blake2 = "0.10"
bytes = "1"
env_logger = "0.11"
http = "1"
ipnet = { version = "2", features = ["serde"] }
log = "0.4"
percent-encoding = "2"
rand = "0.8"
pingora = { version = "0.9.1", features = ["proxy", "openssl", "connection_filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["net", "time"] }
toml = "0.8"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
